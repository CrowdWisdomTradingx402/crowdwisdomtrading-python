[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdwisdomtrading"
version = "0.2.4"
description = "Crowd sentiment from thousands of pro traders for stocks, crypto, futures and FX: free daily and weekly ProCrowdSentimentScore, plus predictions and CrowdMap levels, pay per call."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CrowdWisdom Trading"}]
keywords = ["crowd sentiment", "trading", "stocks", "crypto", "forex", "futures", "market data", "x402", "pay per call", "ai agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
x402 = ["x402[evm,requests]>=2.26", "eth-account>=0.13"]
aihf = ["aihf>=2.7"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://crowdwisdomtrading.com/x402?utm_source=pypi&utm_medium=package&utm_campaign=crowdwisdomtrading"
Catalog = "https://api.crowdwisdomtrading.com/x402/catalog"
Docs = "https://api.crowdwisdomtrading.com/docs"
Terms = "https://www.crowdwisdomtrading.com/api-terms"
Repository = "https://github.com/CrowdWisdomTradingx402/crowdwisdomtrading-python"
Issues = "https://github.com/CrowdWisdomTradingx402/crowdwisdomtrading-python/issues"

[project.scripts]
crowdwisdomtrading = "crowdwisdomtrading.cli:main"

[tool.setuptools]
packages = ["crowdwisdomtrading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
